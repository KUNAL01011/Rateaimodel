name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit + integration (in-memory Mongo, mocked externals) ──────────────────
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run unit + integration tests
        run: npm test

  # ── End-to-end (Playwright against the public site) ─────────────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # Dummy, non-empty values so the frontend boots without real credentials.
      # The e2e journeys never make real Firebase/API calls.
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
      NEXT_PUBLIC_FIREBASE_API_KEY: "ci-dummy-api-key"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-project"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:0000000000:web:cidummy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Deploy to production — only after every test passes, only on main ───────
  deploy:
    name: Deploy (Render + Vercel)
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend → Render
        run: |
          echo "Triggering Render deploy…"
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Deploy frontend → Vercel
        run: |
          echo "Triggering Vercel frontend deploy…"
          curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}"
      - name: Deploy dashboard → Vercel
        run: |
          echo "Triggering Vercel dashboard deploy…"
          curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_DASHBOARD }}"
